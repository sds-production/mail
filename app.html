<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox — Mailbox</title>
<style>
  :root{
    --ink:#12100d;--ink-2:#1a1713;
    --cream:#f4f0e6;--cream-dim:#cfc8b8;
    --gold:#b6893f;--gold-bright:#d9ac5e;
    --line:rgba(244,240,230,0.12);
    --error:#c65b4f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);color:var(--cream);
    font-family:'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 5vw;border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:'Iowan Old Style','Georgia',serif;
    font-size:19px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-bright);
  }
  .user-box{display:flex;align-items:center;gap:12px;}
  .user-box img{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);}
  .user-box span{font-size:13.5px;color:var(--cream-dim);}
  .signout{
    background:transparent;border:1px solid var(--line);color:var(--cream-dim);
    padding:8px 16px;border-radius:2px;cursor:pointer;font-size:12.5px;
    letter-spacing:0.05em;text-transform:uppercase;transition:all .2s ease;
  }
  .signout:hover{border-color:var(--gold);color:var(--gold-bright);}

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 5vw;border-bottom:1px solid var(--line);
  }
  .toolbar h2{font-family:'Iowan Old Style','Georgia',serif;font-weight:400;font-size:22px;}
  .refresh{
    background:transparent;border:1px solid var(--gold);color:var(--gold-bright);
    padding:9px 18px;border-radius:2px;cursor:pointer;font-size:12.5px;
    letter-spacing:0.05em;text-transform:uppercase;transition:all .2s ease;
  }
  .refresh:hover{background:var(--gold);color:var(--ink);}
  .refresh:disabled{opacity:0.5;cursor:default;}

  main{max-width:900px;margin:0 auto;padding:0 5vw 60px;}

  .msg{
    display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .msg:hover{background:var(--ink-2);}
  .msg .from{
    min-width:170px;max-width:170px;font-size:14px;color:var(--cream);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .msg .content{flex:1;min-width:0;}
  .msg .subject{font-size:14.5px;color:var(--cream);margin-bottom:4px;}
  .msg .snippet{
    font-size:13px;color:var(--cream-dim);font-weight:300;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .msg .date{
    min-width:80px;text-align:right;font-size:12px;color:var(--cream-dim);
  }
  .msg.unread .subject{font-weight:700;}
  .msg.unread .from{font-weight:700;}

  .state{
    padding:80px 0;text-align:center;color:var(--cream-dim);font-size:14px;
  }
  .state.error{color:var(--error);}

  /* Reader modal */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:none;align-items:flex-start;justify-content:center;
    padding:6vh 4vw;z-index:10;
  }
  .overlay.open{display:flex;}
  .reader{
    background:var(--ink-2);border:1px solid var(--line);
    max-width:680px;width:100%;max-height:85vh;overflow-y:auto;
    padding:36px;border-radius:2px;
  }
  .reader h3{
    font-family:'Iowan Old Style','Georgia',serif;font-weight:400;font-size:22px;
    margin-bottom:6px;color:var(--cream);
  }
  .reader .meta{font-size:13px;color:var(--cream-dim);margin-bottom:24px;}
  .reader .body{font-size:14.5px;line-height:1.75;color:var(--cream);font-weight:300;white-space:pre-wrap;}
  .reader-close{
    float:right;background:transparent;border:1px solid var(--line);color:var(--cream-dim);
    padding:6px 14px;border-radius:2px;cursor:pointer;font-size:12px;
  }
  .reader-close:hover{border-color:var(--gold);color:var(--gold-bright);}
</style>
</head>
<body>

<header>
  <div class="brand">Mailbox</div>
  <div class="user-box">
    <img id="userPhoto" src="" alt="" style="display:none;">
    <span id="userEmail">Not signed in</span>
    <button class="signout" id="signOutBtn">Sign out</button>
  </div>
</header>

<div class="toolbar">
  <h2>Inbox</h2>
  <button class="refresh" id="refreshBtn">Refresh</button>
</div>

<main>
  <div id="messageList"></div>
</main>

<div class="overlay" id="overlay">
  <div class="reader">
    <button class="reader-close" id="closeReader">Close</button>
    <h3 id="readerSubject"></h3>
    <div class="meta" id="readerMeta"></div>
    <div class="body" id="readerBody"></div>
  </div>
</div>

<script>
  const accessToken = sessionStorage.getItem('gmail_access_token');
  const userEmail = sessionStorage.getItem('user_email');
  const userName = sessionStorage.getItem('user_name');
  const userPhoto = sessionStorage.getItem('user_photo');

  const messageList = document.getElementById('messageList');
  const refreshBtn = document.getElementById('refreshBtn');
  const overlay = document.getElementById('overlay');

  // Guard: no token → back to login
  if (!accessToken) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('userEmail').textContent = userName || userEmail || 'Signed in';
    if (userPhoto) {
      const img = document.getElementById('userPhoto');
      img.src = userPhoto;
      img.style.display = 'inline-block';
    }
    loadInbox();
  }

  document.getElementById('signOutBtn').addEventListener('click', () => {
    sessionStorage.clear();
    window.location.href = 'index.html';
  });

  refreshBtn.addEventListener('click', loadInbox);
  document.getElementById('closeReader').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

  function decodeHeader(headers, name){
    const h = headers.find(x => x.name.toLowerCase() === name.toLowerCase());
    return h ? h.value : '';
  }

  function formatDate(dateStr){
    const d = new Date(dateStr);
    if (isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()){
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }

  async function gmailFetch(path){
    const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/${path}`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if (res.status === 401){
      throw new Error('SESSION_EXPIRED');
    }
    if (!res.ok){
      throw new Error(`Gmail API error (${res.status})`);
    }
    return res.json();
  }

  // Extracts plain-text body from a Gmail message payload (handles nested parts)
  function extractBody(payload){
    function decodeBase64Url(data){
      try {
        return decodeURIComponent(escape(atob(data.replace(/-/g, '+').replace(/_/g, '/'))));
      } catch(e){ return ''; }
    }
    if (payload.body && payload.body.data){
      return decodeBase64Url(payload.body.data);
    }
    if (payload.parts){
      // Prefer text/plain, fall back to text/html stripped of tags
      const plain = payload.parts.find(p => p.mimeType === 'text/plain' && p.body && p.body.data);
      if (plain) return decodeBase64Url(plain.body.data);
      const html = payload.parts.find(p => p.mimeType === 'text/html' && p.body && p.body.data);
      if (html) {
        const raw = decodeBase64Url(html.body.data);
        return raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      }
      // Recurse into nested multiparts
      for (const part of payload.parts){
        if (part.parts) {
          const nested = extractBody(part);
          if (nested) return nested;
        }
      }
    }
    return '(No readable content)';
  }

  async function loadInbox(){
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Loading…';
    messageList.innerHTML = `<div class="state">Loading your inbox…</div>`;

    try {
      const list = await gmailFetch('messages?maxResults=20&labelIds=INBOX');
      if (!list.messages || list.messages.length === 0){
        messageList.innerHTML = `<div class="state">No messages found.</div>`;
        return;
      }

      // Fetch metadata for each message in parallel
      const details = await Promise.all(
        list.messages.map(m =>
          gmailFetch(`messages/${m.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`)
        )
      );

      messageList.innerHTML = '';
      details.forEach(msg => {
        const headers = msg.payload.headers;
        const from = decodeHeader(headers, 'From').replace(/<.*?>/, '').trim();
        const subject = decodeHeader(headers, 'Subject') || '(No subject)';
        const date = formatDate(decodeHeader(headers, 'Date'));
        const isUnread = msg.labelIds && msg.labelIds.includes('UNREAD');

        const row = document.createElement('div');
        row.className = 'msg' + (isUnread ? ' unread' : '');
        row.innerHTML = `
          <div class="from">${from || 'Unknown sender'}</div>
          <div class="content">
            <div class="subject">${subject}</div>
            <div class="snippet">${msg.snippet || ''}</div>
          </div>
          <div class="date">${date}</div>
        `;
        row.addEventListener('click', () => openMessage(msg.id, subject, from, date));
        messageList.appendChild(row);
      });
    } catch (err) {
      console.error(err);
      if (err.message === 'SESSION_EXPIRED'){
        messageList.innerHTML = `<div class="state error">Your session expired. Redirecting to sign in…</div>`;
        setTimeout(() => { sessionStorage.clear(); window.location.href = 'login.html'; }, 1500);
      } else {
        messageList.innerHTML = `<div class="state error">Couldn't load your inbox. ${err.message}</div>`;
      }
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'Refresh';
    }
  }

  async function openMessage(id, subject, from, date){
    document.getElementById('readerSubject').textContent = subject;
    document.getElementById('readerMeta').textContent = `${from} · ${date}`;
    document.getElementById('readerBody').textContent = 'Loading…';
    overlay.classList.add('open');

    try {
      const full = await gmailFetch(`messages/${id}?format=full`);
      const body = extractBody(full.payload);
      document.getElementById('readerBody').textContent = body;
    } catch (err) {
      document.getElementById('readerBody').textContent = 'Could not load message content.';
    }
  }
</script>

</body>
</html>
